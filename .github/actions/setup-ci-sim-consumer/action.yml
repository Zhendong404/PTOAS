name: Setup ci-sim wheel consumer
description: Install and probe the single CPython 3.11 x86_64 PTOAS wheel artifact.
inputs:
  suite:
    description: Consumer suite name used to isolate paths.
    required: true
  producer_run_id:
    description: CI workflow run that produced the shared PTOAS wheel.
    required: false
    default: ""
  system-site-packages:
    description: Install cached CPython 3.11 torch and torch_npu wheels.
    required: false
    default: "false"
outputs:
  python:
    description: Isolated consumer Python executable.
    value: ${{ steps.setup.outputs.python }}
  ptoas:
    description: PTOAS executable installed from the shared wheel.
    value: ${{ steps.setup.outputs.ptoas }}
  work_dir:
    description: Suite-specific working directory.
    value: ${{ steps.setup.outputs.work_dir }}
  log_dir:
    description: Suite-specific log directory.
    value: ${{ steps.setup.outputs.log_dir }}
  ascend_home:
    description: Detected CANN installation root when torch_npu is required.
    value: ${{ steps.setup.outputs.ascend_home }}
runs:
  using: composite
  steps:
    - name: Download shared PTOAS wheel from producer workflow
      if: ${{ inputs.producer_run_id != '' }}
      uses: actions/download-artifact@v4
      with:
        name: ptoas-ci-wheel-cp311-x86_64
        path: ${{ runner.temp }}/ci-sim-${{ inputs.suite }}/wheel
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.producer_run_id }}

    - name: Download shared PTOAS wheel from current workflow
      if: ${{ inputs.producer_run_id == '' }}
      uses: actions/download-artifact@v4
      with:
        name: ptoas-ci-wheel-cp311-x86_64
        path: ${{ runner.temp }}/ci-sim-${{ inputs.suite }}/wheel

    - name: Restore cached Torch and TorchNPU wheels
      if: ${{ inputs.system-site-packages == 'true' }}
      id: restore-torch-npu
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/ci-sim-torch-npu-cp311-x86_64
        key: ci-sim-torch-npu-cp311-x86_64-v2

    - name: Download Torch and TorchNPU wheels on cache miss
      if: ${{ inputs.system-site-packages == 'true' && steps.restore-torch-npu.outputs.cache-hit != 'true' }}
      id: download-torch-npu
      shell: bash
      env:
        TORCH_NPU_CACHE_DIR: ${{ runner.temp }}/ci-sim-torch-npu-cp311-x86_64
        TORCH_WHEEL_URL: https://download.pytorch.org/whl/cpu/torch-2.12.0%2Bcpu-cp311-cp311-manylinux_2_28_x86_64.whl
        TORCH_NPU_WHEEL_URL: https://gitcode.com/Ascend/pytorch/releases/download/v26.1.0-pytorch2.12.0/torch_npu-2.12.0-cp311-cp311-manylinux_2_28_x86_64.whl
      run: |
        set -euo pipefail
        command -v python3.11 >/dev/null 2>&1 || {
          echo "ERROR: ci-sim consumers require python3.11 to install torch and torch_npu" >&2
          exit 1
        }
        rm -rf "${TORCH_NPU_CACHE_DIR}"
        mkdir -p "${TORCH_NPU_CACHE_DIR}"
        python3.11 -m pip download \
          --only-binary=:all: \
          --dest "${TORCH_NPU_CACHE_DIR}" \
          "${TORCH_WHEEL_URL}" \
          "${TORCH_NPU_WHEEL_URL}" \
          numpy \
          PyYAML
        touch "${TORCH_NPU_CACHE_DIR}/.complete"
        echo "downloaded=true" >> "${GITHUB_OUTPUT}"

    - name: Save Torch and TorchNPU wheel cache
      if: >-
        ${{ inputs.system-site-packages == 'true' &&
            steps.download-torch-npu.outputs.downloaded == 'true' &&
            github.event_name != 'pull_request' &&
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/ci-sim-torch-npu-cp311-x86_64
        key: ci-sim-torch-npu-cp311-x86_64-v2

    - name: Install and probe shared wheel
      id: setup
      shell: bash
      env:
        SUITE: ${{ inputs.suite }}
        REQUIRE_TORCH_NPU: ${{ inputs.system-site-packages }}
      run: |
        set -euo pipefail
        root="${RUNNER_TEMP}/ci-sim-${SUITE}"
        wheel_dir="${root}/wheel"
        venv_dir="${root}/venv"
        work_dir="${root}/work"
        log_dir="${root}/logs"
        rm -rf "${venv_dir}" "${work_dir}" "${log_dir}"
        mkdir -p "${work_dir}" "${log_dir}"

        shopt -s nullglob
        wheels=("${wheel_dir}"/*.whl)
        if [[ "${#wheels[@]}" -ne 1 ]]; then
          echo "ERROR: expected exactly one shared wheel, found ${#wheels[@]}" >&2
          printf '  %s\n' "${wheels[@]}" >&2
          exit 1
        fi
        wheel="${wheels[0]}"
        case "$(basename "${wheel}")" in
          *-cp311-cp311-manylinux_2_34_x86_64.whl|*-cp311-cp311-manylinux_2_35_x86_64.whl) ;;
          *)
          echo "ERROR: incompatible shared wheel: $(basename "${wheel}")" >&2
          exit 1
          ;;
        esac

        base_python=python3.11
        ascend_home=""
        if [[ "${REQUIRE_TORCH_NPU}" == "true" ]]; then
          ascend_home="$(bash "${GITHUB_WORKSPACE}/.github/scripts/find_ascend_home.sh")"
          set +u
          source "${ascend_home}/bin/setenv.bash"
          set -u
          command -v "${base_python}" >/dev/null 2>&1 || {
            echo "ERROR: ci-sim consumers require python3.11" >&2
            exit 1
          }
          "${base_python}" -m venv "${venv_dir}"
        else
          command -v "${base_python}" >/dev/null 2>&1 || {
            echo "ERROR: ci-sim consumers require python3.11" >&2
            exit 1
          }
          "${base_python}" -m venv "${venv_dir}"
        fi

        python_bin="${venv_dir}/bin/python"
        "${python_bin}" -m pip --version
        if [[ "${REQUIRE_TORCH_NPU}" == "true" ]]; then
          torch_npu_cache_dir="${RUNNER_TEMP}/ci-sim-torch-npu-cp311-x86_64"
          [[ -f "${torch_npu_cache_dir}/.complete" ]] || {
            echo "ERROR: cached torch and torch_npu wheels are incomplete" >&2
            exit 1
          }
          "${python_bin}" -m pip install --no-index --find-links "${torch_npu_cache_dir}" \
            "${torch_npu_cache_dir}"/torch-*.whl \
            "${torch_npu_cache_dir}"/torch_npu-*.whl \
            numpy \
            PyYAML
        fi
        "${python_bin}" -m pip install --no-deps --force-reinstall "${wheel}"
        "${python_bin}" - <<'PY'
        import ptoas.mlir.ir
        from ptoas.mlir.dialects import pto
        from ptodsl import pto as ptodsl_pto
        print("ptoas and ptodsl import probe passed")
        PY
        "${venv_dir}/bin/ptoas" --version
        if [[ "${REQUIRE_TORCH_NPU}" == "true" ]]; then
          TORCH_DEVICE_BACKEND_AUTOLOAD=0 "${python_bin}" - <<'PY'
        import sys
        import torch
        import torch_npu
        assert sys.version_info[:2] == (3, 11), sys.version
        print("torch", torch.__version__)
        print("torch_npu", getattr(torch_npu, "__version__", "unknown"))
        PY
        fi

        sha256sum "${wheel}" | tee "${log_dir}/wheel.sha256"
        echo "python=${python_bin}" >> "${GITHUB_OUTPUT}"
        echo "ptoas=${venv_dir}/bin/ptoas" >> "${GITHUB_OUTPUT}"
        echo "work_dir=${work_dir}" >> "${GITHUB_OUTPUT}"
        echo "log_dir=${log_dir}" >> "${GITHUB_OUTPUT}"
        echo "ascend_home=${ascend_home}" >> "${GITHUB_OUTPUT}"
