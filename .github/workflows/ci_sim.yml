name: ci-sim

on:
  pull_request:
  # Nightly self-hosted simulator validation (GitHub cron is UTC).
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-sim-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-context:
    if: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}
    runs-on: ubuntu-22.04
    steps:
      - name: Write PR context
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pr-context
          printf '%s\n' "${PR_NUMBER}" > pr-context/pr-number
          printf '%s\n' "${PR_HEAD_SHA}" > pr-context/pr-head-sha

      - name: Upload PR context
        uses: actions/upload-artifact@v4
        with:
          name: pr-context
          path: pr-context
          if-no-files-found: error

  select-ci-sim:
    runs-on: ubuntu-22.04
    outputs:
      wheel: ${{ steps.classify.outputs.wheel }}
      pypto: ${{ steps.classify.outputs.pypto }}
      tileop: ${{ steps.classify.outputs.tileop }}
      vpto: ${{ steps.classify.outputs.vpto }}
      tilelib: ${{ steps.classify.outputs.tilelib }}
      ptodsl: ${{ steps.classify.outputs.ptodsl }}
      matched_paths: ${{ steps.classify.outputs.matched_paths }}
      selection_reason: ${{ steps.classify.outputs.selection_reason }}
    steps:
      - name: Checkout repository for changed-path classification
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Collect pull request changed paths
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const paths = new Set();
            for (const file of files) {
              paths.add(file.filename);
              // Classify both sides of a rename so moving code into an
              // allowlisted path cannot suppress its former owner's suite.
              if (file.previous_filename) paths.add(file.previous_filename);
            }
            fs.writeFileSync('changed-paths', `${[...paths].sort().join('\n')}\n`);

      - name: Test ci-sim selection and duration scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_classify_ci_sim_changes.py'
          node .github/scripts/test_ci_sim_duration_warning.js

      - name: Classify ci-sim selection
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          args=(--event-name "${EVENT_NAME}" --github-output "${GITHUB_OUTPUT}")
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            args+=(--paths-file changed-paths)
          fi
          python3 .github/scripts/classify_ci_sim_changes.py "${args[@]}" | tee selection.json
          echo "Selection reason: $(python3 -c 'import json,sys; print(json.load(open("selection.json"))["selection_reason"])')"

  build-and-test-wheel:
    name: wait-for-ci-build-and-test-wheel
    needs: select-ci-sim
    if: ${{ needs.select-ci-sim.outputs.wheel == 'true' }}
    runs-on: ubuntu-22.04
    outputs:
      producer_run_id: ${{ steps.find-producer.outputs.run_id }}
    steps:
      - name: Wait for matching CI build-and-test wheel artifact
        id: find-producer
        uses: actions/github-script@v7
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const deadline = Date.now() + 45 * 60 * 1000;
            const headSha = process.env.HEAD_SHA;
            const eventName = process.env.EVENT_NAME;
            const workflowId = 'ci.yml';

            while (Date.now() < deadline) {
              const response = await github.request(
                'GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflowId,
                  event: eventName,
                  per_page: 100,
                },
              );
              const candidates = response.data.workflow_runs
                .filter((run) => run.head_sha === headSha ||
                  (run.pull_requests || []).some((pr) => pr.head && pr.head.sha === headSha))
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              const run = candidates[0];

              if (run) {
                const artifacts = await github.paginate(
                  'GET /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts',
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                    per_page: 100,
                  },
                );
                const wheel = artifacts.find((artifact) =>
                  artifact.name === 'ptoas-ci-wheel-cp311-x86_64' && !artifact.expired,
                );
                if (wheel) {
                  core.setOutput('run_id', String(run.id));
                  return;
                }
                if (run.status === 'completed') {
                  core.setFailed(`CI workflow ${run.id} completed with ${run.conclusion} before publishing the wheel`);
                  return;
                }
              }

              await new Promise((resolve) => setTimeout(resolve, 15000));
            }
            core.setFailed(`timed out waiting for successful CI workflow for ${headSha}`);

  verify-ci-build-and-test:
    name: verify-ci-build-and-test
    needs: build-and-test-wheel
    if: ${{ needs.build-and-test-wheel.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Wait for CI build-and-test completion
        uses: actions/github-script@v7
        env:
          PRODUCER_RUN_ID: ${{ needs.build-and-test-wheel.outputs.producer_run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const deadline = Date.now() + 45 * 60 * 1000;
            const runId = Number(process.env.PRODUCER_RUN_ID);
            while (Date.now() < deadline) {
              const response = await github.request(
                'GET /repos/{owner}/{repo}/actions/runs/{run_id}',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: runId,
                },
              );
              const run = response.data;
              if (run.status === 'completed') {
                if (run.conclusion !== 'success') {
                  core.setFailed(`CI workflow ${run.id} completed with ${run.conclusion}`);
                }
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }
            core.setFailed(`timed out waiting for CI workflow ${runId} to complete`);

  pypto-sim-smoke:
    name: pypto-sim-smoke
    needs: [select-ci-sim, build-and-test-wheel]
    if: ${{ needs.select-ci-sim.outputs.pypto == 'true' }}
    runs-on: [self-hosted, Linux, X64, label-1]
    timeout-minutes: 180
    concurrency:
      group: ci-sim-pypto-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      PYPTO_REF: ef6ce7cd8bd33b4c93b58dc34830a20b145736ac
      PTO_ISA_COMMIT: 016396b57e2c17093f1194e6acd89bb112b0ab24
      PYPTO_WORKSPACE: ${{ github.workspace }}/.work/pypto-ci-${{ github.run_id }}
      PYPTO_RUN_WORKSPACE: ${{ github.workspace }}/.work/pypto-run-ci-${{ github.run_id }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install shared wheel
        id: consumer
        uses: ./.github/actions/setup-ci-sim-consumer
        with:
          suite: pypto
          producer_run_id: ${{ needs.build-and-test-wheel.outputs.producer_run_id }}
      - name: Checkout PyPTO
        uses: actions/checkout@v4
        with:
          repository: hw-native-sys/pypto
          ref: ${{ env.PYPTO_REF }}
          path: ${{ env.PYPTO_WORKSPACE }}
          submodules: recursive
          persist-credentials: false
      - name: Checkout PTO-ISA
        uses: actions/checkout@v4
        with:
          repository: hw-native-sys/pto-isa
          ref: ${{ env.PTO_ISA_COMMIT }}
          path: ${{ github.workspace }}/.work/pto-isa-ci-${{ github.run_id }}
          persist-credentials: false
      - name: Prepare PyPTO dependencies
        shell: bash
        env:
          CONSUMER_PYTHON: ${{ steps.consumer.outputs.python }}
        run: |
          set -euo pipefail
          compiler_major() { "$1" -dumpfullversion -dumpversion | cut -d. -f1; }
          if ! command -v g++-15 >/dev/null 2>&1; then
            command -v conda >/dev/null 2>&1 || { echo "ERROR: GCC 15 or conda is required" >&2; exit 1; }
            conda install -y -c conda-forge gcc_linux-64=15 gxx_linux-64=15
            mkdir -p "${PYPTO_WORKSPACE}/.work/bin"
            ln -sf "$(command -v x86_64-conda-linux-gnu-g++)" "${PYPTO_WORKSPACE}/.work/bin/g++-15"
            ln -sf "$(command -v x86_64-conda-linux-gnu-gcc)" "${PYPTO_WORKSPACE}/.work/bin/gcc-15"
            echo "${PYPTO_WORKSPACE}/.work/bin" >> "${GITHUB_PATH}"
          fi
          [[ "$(compiler_major "$(command -v g++-15 || echo "${PYPTO_WORKSPACE}/.work/bin/g++-15")")" == 15 ]] || {
            echo "ERROR: PyPTO simulator smoke requires GCC 15" >&2; exit 1;
          }
          "${CONSUMER_PYTHON}" -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          "${CONSUMER_PYTHON}" -m pip install numpy scikit-build-core nanobind ninja pytest cloudpickle
          "${CONSUMER_PYTHON}" -m pip install --no-build-isolation --no-deps "${PYPTO_WORKSPACE}"
          env -u ASCEND_HOME_PATH "${CONSUMER_PYTHON}" -m pip install --no-build-isolation --no-deps "${PYPTO_WORKSPACE}/runtime"
      - name: Run PyPTO simulator smoke
        id: run
        shell: bash
        env:
          PTOAS_BIN: ${{ steps.consumer.outputs.ptoas }}
          CONSUMER_PYTHON: ${{ steps.consumer.outputs.python }}
          PTO_ISA_ROOT: ${{ github.workspace }}/.work/pto-isa-ci-${{ github.run_id }}
          TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
        run: |
          bash .github/scripts/run_pypto_sim_smoke.sh
      - name: Upload PyPTO logs and wheel digest
        if: ${{ always() && steps.consumer.outputs.log_dir != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pypto-sim-smoke-${{ github.run_id }}
          path: |
            ${{ steps.consumer.outputs.log_dir }}/wheel.sha256
            ${{ env.PYPTO_RUN_WORKSPACE }}/**
          if-no-files-found: warn
          overwrite: true

  tileop-st:
    name: tileop-st
    needs: [select-ci-sim, build-and-test-wheel]
    if: ${{ needs.select-ci-sim.outputs.tileop == 'true' }}
    runs-on: [self-hosted, Linux, X64, label-1]
    timeout-minutes: 180
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install shared wheel
        id: consumer
        uses: ./.github/actions/setup-ci-sim-consumer
        with:
          suite: tileop
          producer_run_id: ${{ needs.build-and-test-wheel.outputs.producer_run_id }}
      - name: Resolve simulator environment
        shell: bash
        run: |
          set -euo pipefail
          detected="$(bash .github/scripts/find_ascend_home.sh)"
          echo "ASCEND_HOME_PATH=${detected}" >> "${GITHUB_ENV}"
      - name: Run TileOp ST
        shell: bash
        env:
          PTOAS_BIN: ${{ steps.consumer.outputs.ptoas }}
        run: |
          set -euo pipefail
          set +u
          source "${ASCEND_HOME_PATH}/bin/setenv.bash"
          set -u
          mkdir -p "${{ steps.consumer.outputs.work_dir }}"
          ASCEND_HOME_PATH="${ASCEND_HOME_PATH}" PTOAS_BIN="${PTOAS_BIN}" \
            bash test/tilelang_st/script/run_ci.sh -r sim -v a5 --build-jobs 32 --jobs 64 --smoke \
            2>&1 | tee "${{ steps.consumer.outputs.log_dir }}/tileop-st.log"
      - name: Upload TileOp logs and wheel digest
        if: ${{ always() && steps.consumer.outputs.work_dir != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tileop-st-${{ github.run_id }}
          path: |
            ${{ steps.consumer.outputs.log_dir }}/**
            ${{ steps.consumer.outputs.work_dir }}/**
          if-no-files-found: warn
          overwrite: true

  vpto-sim:
    name: vpto-sim
    needs: [select-ci-sim, build-and-test-wheel]
    if: ${{ needs.select-ci-sim.outputs.vpto == 'true' }}
    runs-on: [self-hosted, Linux, X64, label-1]
    timeout-minutes: 180
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install shared wheel with torch_npu runtime
        id: consumer
        uses: ./.github/actions/setup-ci-sim-consumer
        with:
          suite: vpto
          system-site-packages: "true"
          producer_run_id: ${{ needs.build-and-test-wheel.outputs.producer_run_id }}
      - name: Run VPTO SIM
        shell: bash
        env:
          PTOAS_BIN: ${{ steps.consumer.outputs.ptoas }}
        run: |
          set -euo pipefail
          set +u
          source "${{ steps.consumer.outputs.ascend_home }}/bin/setenv.bash"
          set -u
          mkdir -p "${{ steps.consumer.outputs.work_dir }}"
          WORK_SPACE="${{ steps.consumer.outputs.work_dir }}" \
          ASCEND_HOME_PATH="${ASCEND_HOME_PATH}" PTOAS_BIN="${PTOAS_BIN}" DEVICE=SIM \
            JOBS="${JOBS:-32}" bash test/vpto/scripts/run_host_vpto_validation_parallel.sh \
            2>&1 | tee "${{ steps.consumer.outputs.log_dir }}/vpto-sim.log"
      - name: Upload VPTO logs and wheel digest
        if: ${{ always() && steps.consumer.outputs.work_dir != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: vpto-sim-${{ github.run_id }}
          path: |
            ${{ steps.consumer.outputs.log_dir }}/**
            ${{ steps.consumer.outputs.work_dir }}/parallel-summary.tsv
            ${{ steps.consumer.outputs.work_dir }}/parallel-runner.log
            ${{ steps.consumer.outputs.work_dir }}/*/validation.log
          if-no-files-found: warn
          overwrite: true

  tilelib-st:
    name: tilelib-st
    needs: [select-ci-sim, build-and-test-wheel]
    if: ${{ needs.select-ci-sim.outputs.tilelib == 'true' }}
    runs-on: [self-hosted, Linux, X64, label-1]
    timeout-minutes: 180
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install shared wheel with torch_npu runtime
        id: consumer
        uses: ./.github/actions/setup-ci-sim-consumer
        with:
          suite: tilelib
          system-site-packages: "true"
          producer_run_id: ${{ needs.build-and-test-wheel.outputs.producer_run_id }}
      - name: Run TileLib ST
        shell: bash
        env:
          PTOAS_BIN: ${{ steps.consumer.outputs.ptoas }}
          PYTHON_BIN: ${{ steps.consumer.outputs.python }}
          PTO_PYTHON_BIN: ${{ steps.consumer.outputs.python }}
        run: |
          set -euo pipefail
          set +u
          source "${{ steps.consumer.outputs.ascend_home }}/bin/setenv.bash"
          set -u
          TILELIB_ST_OUTPUT_ROOT="${{ steps.consumer.outputs.work_dir }}/tilelib-st-a5" \
          ASCEND_HOME_PATH="${ASCEND_HOME_PATH}" PTOAS_BIN="${PTOAS_BIN}" \
            scripts/sim_dsl.sh test/tilelib-st/run_tilelib_st.py -- test/tilelib-st/a5 \
            2>&1 | tee "${{ steps.consumer.outputs.log_dir }}/tilelib-st.log"
      - name: Upload TileLib logs and wheel digest
        if: ${{ always() && steps.consumer.outputs.work_dir != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tilelib-st-${{ github.run_id }}
          path: |
            ${{ steps.consumer.outputs.log_dir }}/**
            ${{ steps.consumer.outputs.work_dir }}/**
          if-no-files-found: warn
          overwrite: true

  ptodsl-st:
    name: ptodsl-st
    needs: [select-ci-sim, build-and-test-wheel]
    if: ${{ needs.select-ci-sim.outputs.ptodsl == 'true' }}
    runs-on: [self-hosted, Linux, X64, label-1]
    timeout-minutes: 180
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install shared wheel with torch_npu runtime
        id: consumer
        uses: ./.github/actions/setup-ci-sim-consumer
        with:
          suite: ptodsl
          system-site-packages: "true"
          producer_run_id: ${{ needs.build-and-test-wheel.outputs.producer_run_id }}
      - name: Run PTODSL ST
        shell: bash
        env:
          PTOAS_BIN: ${{ steps.consumer.outputs.ptoas }}
          PYTHON_BIN: ${{ steps.consumer.outputs.python }}
          PTO_PYTHON_BIN: ${{ steps.consumer.outputs.python }}
        run: |
          set -euo pipefail
          set +u
          source "${{ steps.consumer.outputs.ascend_home }}/bin/setenv.bash"
          set -u
          ASCEND_HOME_PATH="${ASCEND_HOME_PATH}" PTOAS_BIN="${PTOAS_BIN}" \
            scripts/sim_dsl.sh test/dsl-st \
            2>&1 | tee "${{ steps.consumer.outputs.log_dir }}/ptodsl-st.log"
      - name: Upload PTODSL logs and wheel digest
        if: ${{ always() && steps.consumer.outputs.work_dir != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ptodsl-st-${{ github.run_id }}
          path: |
            ${{ steps.consumer.outputs.log_dir }}/**
            ${{ steps.consumer.outputs.work_dir }}/**
          if-no-files-found: warn
          overwrite: true

  ci-sim-required:
    name: ci-sim-required
    if: ${{ always() }}
    needs:
      - select-ci-sim
      - build-and-test-wheel
      - verify-ci-build-and-test
      - pypto-sim-smoke
      - tileop-st
      - vpto-sim
      - tilelib-st
      - ptodsl-st
    runs-on: ubuntu-22.04
    steps:
      - name: Validate selected CI graph
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.select-ci-sim.result }}
          WHEEL_SELECTED: ${{ needs.select-ci-sim.outputs.wheel }}
          X86_WHEEL_RESULT: ${{ needs.build-and-test-wheel.result }}
          CI_BUILD_AND_TEST_RESULT: ${{ needs.verify-ci-build-and-test.result }}
          PYPTO_SELECTED: ${{ needs.select-ci-sim.outputs.pypto }}
          PYPTO_RESULT: ${{ needs.pypto-sim-smoke.result }}
          TILEOP_SELECTED: ${{ needs.select-ci-sim.outputs.tileop }}
          TILEOP_RESULT: ${{ needs.tileop-st.result }}
          VPTO_SELECTED: ${{ needs.select-ci-sim.outputs.vpto }}
          VPTO_RESULT: ${{ needs.vpto-sim.result }}
          TILELIB_SELECTED: ${{ needs.select-ci-sim.outputs.tilelib }}
          TILELIB_RESULT: ${{ needs.tilelib-st.result }}
          PTODSL_SELECTED: ${{ needs.select-ci-sim.outputs.ptodsl }}
          PTODSL_RESULT: ${{ needs.ptodsl-st.result }}
          SELECTION_REASON: ${{ needs.select-ci-sim.outputs.selection_reason }}
        run: |
          set -euo pipefail
          failures=()

          require_result() {
            local name="$1" selected="$2" result="$3"
            local expected="skipped"
            [[ "${selected}" == "true" ]] && expected="success"
            if [[ "${result}" != "${expected}" ]]; then
              failures+=("${name}: selected=${selected}, expected=${expected}, actual=${result}")
            fi
          }

          if [[ "${SELECTION_RESULT}" != "success" ]]; then
            failures+=("selection: expected=success, actual=${SELECTION_RESULT}")
          fi
          require_result build-and-test-wheel "${WHEEL_SELECTED}" "${X86_WHEEL_RESULT}"
          require_result verify-ci-build-and-test "${WHEEL_SELECTED}" "${CI_BUILD_AND_TEST_RESULT}"
          require_result pypto-sim-smoke "${PYPTO_SELECTED}" "${PYPTO_RESULT}"
          require_result tileop-st "${TILEOP_SELECTED}" "${TILEOP_RESULT}"
          require_result vpto-sim "${VPTO_SELECTED}" "${VPTO_RESULT}"
          require_result tilelib-st "${TILELIB_SELECTED}" "${TILELIB_RESULT}"
          require_result ptodsl-st "${PTODSL_SELECTED}" "${PTODSL_RESULT}"

          {
            echo "### ci-sim required gate"
            echo
            echo "Selection: ${SELECTION_REASON:-unavailable}"
            echo
            echo '| Job | Selected | Result |'
            echo '| --- | --- | --- |'
            echo "| build-and-test-wheel | ${WHEEL_SELECTED} | ${X86_WHEEL_RESULT} |"
            echo "| verify-ci-build-and-test | ${WHEEL_SELECTED} | ${CI_BUILD_AND_TEST_RESULT} |"
            echo "| pypto-sim-smoke | ${PYPTO_SELECTED} | ${PYPTO_RESULT} |"
            echo "| tileop-st | ${TILEOP_SELECTED} | ${TILEOP_RESULT} |"
            echo "| vpto-sim | ${VPTO_SELECTED} | ${VPTO_RESULT} |"
            echo "| tilelib-st | ${TILELIB_SELECTED} | ${TILELIB_RESULT} |"
            echo "| ptodsl-st | ${PTODSL_SELECTED} | ${PTODSL_RESULT} |"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${#failures[@]}" -ne 0 ]]; then
            printf 'ERROR: %s\n' "${failures[@]}" >&2
            exit 1
          fi
          echo "All selected ci-sim jobs succeeded and all unselected jobs skipped."
