name: Reusable Linux wheel build

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      python:
        required: true
        type: string
      release_kind:
        required: false
        default: ptoas
        type: string
      enable_ccache:
        required: false
        default: false
        type: boolean
      save_ccache:
        required: false
        default: false
        type: boolean
      upload_wheel:
        required: false
        default: false
        type: boolean
      wheel_artifact_name:
        required: false
        default: ""
        type: string
      upload_binary:
        required: false
        default: true
        type: boolean
      llvm_profile:
        description: LLVM profile for this consumer. PR validation uses assert-static; releases use release-static.
        required: false
        default: release-static
        type: string

permissions:
  contents: read

env:
  LLVM_REPO: https://github.com/vpto-dev/llvm-project.git
  LLVM_REF: feature-vpto-llvm21
  LLVM_CACHE_FLAVOR: ${{ inputs.llvm_profile == 'assert-static' && 'llvm21-assert-static-mlirpy-hardening-install-v1' || 'llvm21-vpto-wheel-static-pic-utils-v3' }}

jobs:
  build_wheel:
    if: github.event_name != 'release' || startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'ptoas-v')
    name: Build ptoas wheel (${{ inputs.arch }}, py${{ inputs.python }})
    runs-on: ${{ inputs.arch == 'x86_64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    defaults:
      run:
        shell: bash

    container:
      image: quay.io/pypa/manylinux_2_34_${{ inputs.arch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Python version
        env:
          INPUT_PYTHON: ${{ inputs.python }}
        run: |
          case "${INPUT_PYTHON}" in
            "3.10") PY_VER="cp310-cp310" ;;
            "3.11") PY_VER="cp311-cp311" ;;
            "3.12") PY_VER="cp312-cp312" ;;
            *)
              echo "Unsupported Python version: ${INPUT_PYTHON}" >&2
              exit 1
              ;;
          esac
          echo "PY_VER=${PY_VER}" >> "${GITHUB_ENV}"
          echo "PY_PATH=/opt/python/${PY_VER}" >> "${GITHUB_ENV}"
          echo "/opt/python/${PY_VER}/bin" >> "${GITHUB_PATH}"

      - name: Install system dependencies
        run: |
          dnf install -y ninja-build cmake git ccache clang lld zip binutils patchelf chrpath
          dnf clean all

      - name: Configure Clang toolchain
        id: clang-config
        run: |
          set -euo pipefail
          clang_c="$(command -v clang)"
          clang_cxx="$(command -v clang++)"
          [[ -x "${clang_c}" && -x "${clang_cxx}" ]] || {
            echo "clang and clang++ are required for wheel builds" >&2
            exit 1
          }
          echo "CC=${clang_c}" >> "${GITHUB_ENV}"
          echo "CXX=${clang_cxx}" >> "${GITHUB_ENV}"
          echo "CMAKE_C_COMPILER=${clang_c}" >> "${GITHUB_ENV}"
          echo "CMAKE_CXX_COMPILER=${clang_cxx}" >> "${GITHUB_ENV}"
          echo "compiler=${clang_c}" >> "${GITHUB_OUTPUT}"
          echo "compiler_cxx=${clang_cxx}" >> "${GITHUB_OUTPUT}"
          "${clang_c}" --version | head -n 1
          "${clang_cxx}" --version | head -n 1

      - name: Install Python dependencies
        run: |
          # LLVM/MLIR Python bindings are not yet compatible with pybind11 3.x.
          pip install --no-cache-dir numpy 'pybind11<3' nanobind 'scikit-build-core>=0.12.2,<2' auditwheel

      - name: Configure ccache
        id: ccache-config
        if: ${{ inputs.enable_ccache }}
        run: |
          set -euo pipefail
          echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache" >> "${GITHUB_ENV}"
          echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          echo "CCACHE_COMPILERCHECK=content" >> "${GITHUB_ENV}"
          echo "CCACHE_NOHASHDIR=true" >> "${GITHUB_ENV}"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "${GITHUB_ENV}"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "${GITHUB_ENV}"
          compiler_id="$(clang -dumpfullversion -dumpversion)"
          echo "compiler_id=${compiler_id}" >> "${GITHUB_OUTPUT}"

      - name: Resolve PTOAS distribution version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            case "${GITHUB_REF_NAME}" in
              vmi-v*)
                EXPECTED_RELEASE_VERSION="$(python packaging/ptoas-vmi/prepare_source.py --print-version)"
                PTOAS_VERSION="${GITHUB_REF_NAME#vmi-v}"
                PTOAS_CLI_VERSION="vmi ${PTOAS_VERSION}"
                PTOAS_PYTHON_PACKAGE_NAME="ptoas-vmi"
                ;;
              ptoas-v*)
                EXPECTED_RELEASE_VERSION="$(python .github/scripts/compute_ptoas_version.py --mode release)"
                PTOAS_VERSION="${GITHUB_REF_NAME#ptoas-v}"
                PTOAS_CLI_VERSION="${PTOAS_VERSION}"
                PTOAS_PYTHON_PACKAGE_NAME="ptoas"
                ;;
              v*)
                EXPECTED_RELEASE_VERSION="$(python .github/scripts/compute_ptoas_version.py --mode release)"
                PTOAS_VERSION="${GITHUB_REF_NAME#v}"
                PTOAS_CLI_VERSION="${PTOAS_VERSION}"
                PTOAS_PYTHON_PACKAGE_NAME="ptoas"
                ;;
              *)
                echo "release tags must start with 'v', 'ptoas-v', or 'vmi-v'" >&2
                exit 1
                ;;
            esac
            if [ "${PTOAS_VERSION}" != "${EXPECTED_RELEASE_VERSION}" ]; then
              echo "release tag '${GITHUB_REF_NAME}' does not match project version '${EXPECTED_RELEASE_VERSION}'" >&2
              exit 1
            fi
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${{ inputs.release_kind }}" = "vmi" ]; then
            PTOAS_VERSION="$(python packaging/ptoas-vmi/prepare_source.py --print-version)"
            PTOAS_CLI_VERSION="vmi ${PTOAS_VERSION}"
            PTOAS_PYTHON_PACKAGE_NAME="ptoas-vmi"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            PTOAS_VERSION="$(python .github/scripts/compute_ptoas_version.py --mode release)"
            PTOAS_CLI_VERSION="${PTOAS_VERSION}"
            PTOAS_PYTHON_PACKAGE_NAME="ptoas"
          else
            PTOAS_VERSION="$(python .github/scripts/compute_ptoas_version.py --mode dev)"
            PTOAS_CLI_VERSION="${PTOAS_VERSION}"
            PTOAS_PYTHON_PACKAGE_NAME="ptoas"
          fi
          echo "PTOAS_VERSION=${PTOAS_VERSION}" >> "${GITHUB_ENV}"
          echo "PTOAS_CLI_VERSION=${PTOAS_CLI_VERSION}" >> "${GITHUB_ENV}"
          echo "PTOAS_PYTHON_PACKAGE_NAME=${PTOAS_PYTHON_PACKAGE_NAME}" >> "${GITHUB_ENV}"
          echo "Using PTOAS CLI version: ${PTOAS_CLI_VERSION}"

      - name: Validate PEP 517 project metadata
        run: python -m scikit_build_core.build project-table

      - name: Set build directories
        run: |
          echo "WORKSPACE_DIR=/llvm-workspace" >> "${GITHUB_ENV}"
          echo "LLVM_SOURCE_DIR=/llvm-workspace/llvm-project" >> "${GITHUB_ENV}"
          echo "LLVM_BUILD_DIR=/llvm-workspace/llvm-project/build-wheel-static" >> "${GITHUB_ENV}"
          echo "LLVM_INSTALL_DIR=/llvm-workspace/llvm-install" >> "${GITHUB_ENV}"
          echo "PTO_SOURCE_DIR=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          echo "PTO_BUILD_DIR=${GITHUB_WORKSPACE}/build-release" >> "${GITHUB_ENV}"
          if [[ "${{ inputs.llvm_profile }}" == "assert-static" ]]; then
            echo "LLVM_ASSERTIONS=ON" >> "${GITHUB_ENV}"
          else
            echo "LLVM_ASSERTIONS=OFF" >> "${GITHUB_ENV}"
          fi

      - name: Resolve LLVM source SHA
        id: llvm-source
        run: |
          LLVM_SOURCE_SHA="$(git ls-remote "${LLVM_REPO}" "refs/heads/${LLVM_REF}" | awk '{print $1}')"
          [[ -n "${LLVM_SOURCE_SHA}" ]] || { echo "failed to resolve LLVM source" >&2; exit 1; }
          echo "sha=${LLVM_SOURCE_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Restore main PTOAS ccache
        if: ${{ inputs.enable_ccache }}
        id: cache-ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ptoas-wheel-ccache-main-${{ inputs.arch }}-py${{ inputs.python }}-llvm${{ steps.llvm-source.outputs.sha }}-clang${{ steps.ccache-config.outputs.compiler_id }}-${{ env.LLVM_CACHE_FLAVOR }}-${{ github.sha }}
          restore-keys: |
            ptoas-wheel-ccache-main-${{ inputs.arch }}-py${{ inputs.python }}-llvm${{ steps.llvm-source.outputs.sha }}-clang${{ steps.ccache-config.outputs.compiler_id }}-${{ env.LLVM_CACHE_FLAVOR }}-

      - name: Initialize PTOAS ccache
        if: ${{ inputs.enable_ccache }}
        run: |
          ccache --max-size=2G
          ccache --zero-stats

      - name: Restore LLVM install cache
        id: cache-llvm
        uses: actions/cache/restore@v4
        with:
          path: /llvm-workspace/llvm-install
          key: llvm-${{ steps.llvm-source.outputs.sha }}-manylinux_2_34-${{ inputs.arch }}-${{ env.LLVM_CACHE_FLAVOR }}

      - name: Prepare LLVM source
        run: |
          set -euo pipefail
          mkdir -p "${LLVM_SOURCE_DIR}"
          cd "${LLVM_SOURCE_DIR}"
          if [ ! -d .git ]; then
            git init
            git remote add origin "${LLVM_REPO}"
          fi
          git remote set-url origin "${LLVM_REPO}"
          git fetch --depth 1 origin "${{ steps.llvm-source.outputs.sha }}"
          git checkout --force "${{ steps.llvm-source.outputs.sha }}"

      - name: Build LLVM/MLIR
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        env:
          ENABLE_CCACHE: ${{ inputs.enable_ccache }}
        run: |
          cd "${LLVM_SOURCE_DIR}"
          llvm_cmake_launcher=()
          if [[ "${ENABLE_CCACHE}" == "true" ]]; then
            llvm_cmake_launcher=(
              -DCMAKE_C_COMPILER_LAUNCHER=ccache
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            )
          fi
          cmake -C "${PTO_SOURCE_DIR}/cmake/LinuxHardeningCache.cmake" -G Ninja -S llvm -B "${LLVM_BUILD_DIR}" \
            -DLLVM_ENABLE_PROJECTS="mlir;clang" -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF -DLLVM_LINK_LLVM_DYLIB=OFF -DMLIR_LINK_MLIR_DYLIB=OFF \
            -DLLVM_ENABLE_PIC=ON -DMLIR_INSTALL_AGGREGATE_OBJECTS=ON -DLLVM_ENABLE_ASSERTIONS="${LLVM_ASSERTIONS}" \
            -DLLVM_INSTALL_UTILS=ON \
            -DMLIR_ENABLE_BINDINGS_PYTHON=ON -DPython3_EXECUTABLE="${PY_PATH}/bin/python" \
            -DPython_EXECUTABLE="${PY_PATH}/bin/python" -Dpybind11_DIR="$(${PY_PATH}/bin/python -m pybind11 --cmakedir)" \
            -Dnanobind_DIR="$(${PY_PATH}/bin/python -m nanobind --cmake_dir)" \
            -DCMAKE_BUILD_TYPE=Release -DLLVM_TARGETS_TO_BUILD=host \
            -DCMAKE_C_COMPILER="${CMAKE_C_COMPILER}" -DCMAKE_CXX_COMPILER="${CMAKE_CXX_COMPILER}" \
            -DCMAKE_INSTALL_PREFIX="${LLVM_INSTALL_DIR}" "${llvm_cmake_launcher[@]}"
          ninja -C "${LLVM_BUILD_DIR}"
          cmake --install "${LLVM_BUILD_DIR}"

      - name: Save LLVM build cache
        if: >-
          steps.cache-llvm.outputs.cache-hit != 'true' &&
          github.event_name == 'workflow_dispatch' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          inputs.python == '3.11' &&
          success()
        uses: actions/cache/save@v4
        with:
          path: /llvm-workspace/llvm-install
          key: llvm-${{ steps.llvm-source.outputs.sha }}-manylinux_2_34-${{ inputs.arch }}-${{ env.LLVM_CACHE_FLAVOR }}

      - name: Build PTOAS wheel
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          ENABLE_CCACHE: ${{ inputs.enable_ccache }}
          CMAKE_C_COMPILER_LAUNCHER: ${{ inputs.enable_ccache && 'ccache' || '' }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ inputs.enable_ccache && 'ccache' || '' }}
        run: |
          set -euo pipefail
          if [ "${PTOAS_PYTHON_PACKAGE_NAME}" = "ptoas-vmi" ]; then
            PTOAS_WHEEL_SOURCE_DIR="${PTO_SOURCE_DIR}/.work/ptoas-vmi-source"
            python packaging/ptoas-vmi/prepare_source.py --output-dir "${PTOAS_WHEEL_SOURCE_DIR}"
          else
            PTOAS_WHEEL_SOURCE_DIR="${PTO_SOURCE_DIR}"
          fi
          rm -rf "${PTO_SOURCE_DIR}/build/wheel-dist" "${GITHUB_WORKSPACE}/wheelhouse"
          mkdir -p "${PTO_SOURCE_DIR}/build/wheel-dist"
          cmake_settings=(
            --config-settings=cmake.define.CMAKE_C_COMPILER="${CMAKE_C_COMPILER}"
            --config-settings=cmake.define.CMAKE_CXX_COMPILER="${CMAKE_CXX_COMPILER}"
          )
          if [[ "${ENABLE_CCACHE}" == "true" ]]; then
            # Pass the launcher as an explicit scikit-build-core CMake
            # definition. Relying only on CMAKE_*_COMPILER_LAUNCHER in the
            # subprocess environment is not reliable across CMake versions.
            cmake_settings+=(
              --config-settings=cmake.define.CMAKE_C_COMPILER_LAUNCHER=ccache
              --config-settings=cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=ccache
            )
          fi
          SKBUILD_BUILD_DIR="${PTO_BUILD_DIR}" LLVM_BUILD_DIR="${LLVM_INSTALL_DIR}" \
            python -m pip wheel "${cmake_settings[@]}" "${PTOAS_WHEEL_SOURCE_DIR}" \
            --no-build-isolation --no-deps \
            --wheel-dir "${PTO_SOURCE_DIR}/build/wheel-dist"

      - name: Validate wheel payload and launcher contract
        run: python "${PTO_SOURCE_DIR}/docker/validate_wheel_payload.py" "${PTO_SOURCE_DIR}/build/wheel-dist"

      - name: Repair wheel with auditwheel
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/wheelhouse"
          export LD_LIBRARY_PATH="${LLVM_INSTALL_DIR}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          auditwheel repair --plat "manylinux_2_34_${{ inputs.arch }}" \
            "${PTO_SOURCE_DIR}/build/wheel-dist"/ptoas*.whl -w "${GITHUB_WORKSPACE}/wheelhouse"

      - name: Validate repaired wheel identity
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=("${GITHUB_WORKSPACE}/wheelhouse"/ptoas*.whl)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "Expected exactly one repaired PTOAS wheel, found ${#wheels[@]}:" >&2
            printf '  %s\n' "${wheels[@]}" >&2
            exit 1
          fi
          case "${{ inputs.python }}" in
            "3.10") expected_abi="cp310-cp310" ;;
            "3.11") expected_abi="cp311-cp311" ;;
            "3.12") expected_abi="cp312-cp312" ;;
            *) echo "Unsupported Python version: ${{ inputs.python }}" >&2; exit 1 ;;
          esac
          wheel_name="$(basename "${wheels[0]}")"
          expected_suffix="-${expected_abi}-manylinux_2_34_${{ inputs.arch }}.whl"
          if [[ "${wheel_name}" != *"${expected_suffix}" ]]; then
            echo "Wheel '${wheel_name}' does not match expected suffix '${expected_suffix}'" >&2
            exit 1
          fi
          echo "Validated repaired wheel: ${wheel_name}"

      - name: Test wheel installation
        run: |
          PTO_EXPECT_STATIC_LLVM=1 \
          PTO_TEST_WHEEL_PATH="${GITHUB_WORKSPACE}/wheelhouse/ptoas*.whl" \
            bash "${PTO_SOURCE_DIR}/docker/test_wheel_imports.sh"

      - name: Upload wheel artifact
        if: ${{ inputs.upload_wheel }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.wheel_artifact_name || format('ptoas-wheel-py{0}-{1}', inputs.python, inputs.arch) }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          overwrite: true

      - name: Collect ptoas binary and dependencies
        if: ${{ inputs.upload_binary && inputs.python == '3.11' }}
        run: |
          rm -rf "${GITHUB_WORKSPACE}/ptoas-dist"
          cmake --install "${PTO_BUILD_DIR}" --prefix "${GITHUB_WORKSPACE}/ptoas-dist" --component PTOAS_Python
          cmake --install "${PTO_BUILD_DIR}" --prefix "${GITHUB_WORKSPACE}/ptoas-dist" --component PTOAS_CompilerArchive

      - name: Archive ptoas binary artifact
        if: ${{ inputs.upload_binary && inputs.python == '3.11' }}
        run: |
          chmod +x "${GITHUB_WORKSPACE}/ptoas-dist/bin/ptoas"
          tar -czf "${GITHUB_WORKSPACE}/ptoas-bin-${{ inputs.arch }}.tar.gz" -C "${GITHUB_WORKSPACE}/ptoas-dist" .

      - name: Smoke test archived ptoas binary artifact
        if: ${{ inputs.upload_binary && inputs.python == '3.11' }}
        run: |
          set -euo pipefail
          TEST_DIR="${RUNNER_TEMP}/ptoas-dist-smoke-${{ inputs.arch }}"
          rm -rf "${TEST_DIR}" && mkdir -p "${TEST_DIR}/extracted"
          tar -xzf "${GITHUB_WORKSPACE}/ptoas-bin-${{ inputs.arch }}.tar.gz" -C "${TEST_DIR}/extracted"
          test -x "${TEST_DIR}/extracted/bin/ptoas"
          test -f "${TEST_DIR}/extracted/ptoas/_cli.py"
          test -f "${TEST_DIR}/extracted/ptoas/mlir/ir.py"
          test -f "${TEST_DIR}/extracted/ptodsl/__init__.py"
          test -d "${TEST_DIR}/extracted/ptoas/_runtime/share/ptoas/TileOps"
          test "$(cat "${TEST_DIR}/extracted/.ptoas-python-version")" = "3.11"
          compgen -G "${TEST_DIR}/extracted/ptoas/_core*.so" >/dev/null
          compgen -G "${TEST_DIR}/extracted/ptoas/mlir/_mlir_libs/libPTOASCompiler*" >/dev/null
          ! compgen -G "${TEST_DIR}/extracted/ptoas/mlir/_mlir_libs/libPTOASPythonCAPI*" >/dev/null
          python "${PTO_SOURCE_DIR}/docker/validate_installed_native_dependencies.py" \
            "${TEST_DIR}/extracted/ptoas" --expect-static-llvm
          env -u PYTHONPATH -u DYLD_LIBRARY_PATH -u LD_LIBRARY_PATH \
            "${TEST_DIR}/extracted/bin/ptoas" --version
          env -u PYTHONPATH -u DYLD_LIBRARY_PATH -u LD_LIBRARY_PATH \
            "${TEST_DIR}/extracted/bin/ptoas" \
            "${PTO_SOURCE_DIR}/test/lit/pto/kernel_kind_vector_scf_while_emitc.pto" \
            >/dev/null

      - name: Upload ptoas binary artifact
        if: ${{ inputs.upload_binary && inputs.python == '3.11' }}
        uses: actions/upload-artifact@v4
        with:
          name: ptoas-bin-${{ inputs.arch }}
          path: ptoas-bin-${{ inputs.arch }}.tar.gz
          if-no-files-found: error
          overwrite: true

      - name: Show ccache statistics
        if: ${{ always() && inputs.enable_ccache }}
        run: ccache --show-stats

      - name: Save main PTOAS ccache
        if: ${{ inputs.save_ccache && success() }}
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ptoas-wheel-ccache-main-${{ inputs.arch }}-py${{ inputs.python }}-llvm${{ steps.llvm-source.outputs.sha }}-clang${{ steps.ccache-config.outputs.compiler_id }}-${{ env.LLVM_CACHE_FLAVOR }}-${{ github.sha }}
