name: Build Wheel

on:
  push:
    branches:
      - main
  # Nightly build & publish (UTC time).
  schedule:
    - cron: "10 17 * * *"
  workflow_dispatch:
    inputs:
      release_kind:
        description: Manual release flavor for dry-runs
        type: choice
        options:
          - ptoas
          - vmi
        default: ptoas
  release:
    types: [prereleased, released]

permissions:
  contents: read

concurrency:
  group: build-wheel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  build_wheel:
    if: github.event_name != 'release' || startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'ptoas-v')
    # Non-release runs keep a single-Python matrix for faster gates;
    # release/nightly runs fan out to publish the full wheel set plus binary artifacts.
    name: Build ptoas wheel (${{ matrix.arch }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJson((github.event_name == 'release' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["3.10","3.11","3.12"]' || '["3.11"]') }}
        arch: ["x86_64", "aarch64"]
    uses: ./.github/workflows/_build_linux_wheel.yml
    with:
      arch: ${{ matrix.arch }}
      python: ${{ matrix.python }}
      release_kind: ${{ inputs.release_kind || 'ptoas' }}
      enable_ccache: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
      save_ccache: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      upload_wheel: ${{ (github.event_name == 'pull_request' && matrix.arch == 'x86_64' && matrix.python == '3.11') || github.event_name == 'release' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      wheel_artifact_name: ${{ github.event_name == 'pull_request' && matrix.arch == 'x86_64' && matrix.python == '3.11' && 'ptoas-ci-wheel-cp311-x86_64' || format('ptoas-wheel-py{0}-{1}', matrix.python, matrix.arch) }}
      upload_binary: true

  upload_release_assets:
    name: Upload release assets
    if: (github.event_name == 'release' && (startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'ptoas-v'))) || github.event_name == 'schedule'
    needs: build_wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Compute release metadata
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "RELEASE_PRERELEASE=false" >> "$GITHUB_ENV"
            if [[ "${GITHUB_REF_NAME}" == vmi-v* ]]; then
              echo "RELEASE_MAKE_LATEST=false" >> "$GITHUB_ENV"
            else
              echo "RELEASE_MAKE_LATEST=true" >> "$GITHUB_ENV"
            fi
            {
              echo "RELEASE_BODY<<EOF"
              echo "Published release assets for ${GITHUB_REF_NAME}."
              echo "EOF"
            } >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=nightly" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=Nightly Build" >> "$GITHUB_ENV"
            echo "RELEASE_PRERELEASE=true" >> "$GITHUB_ENV"
            echo "RELEASE_MAKE_LATEST=false" >> "$GITHUB_ENV"
            {
              echo "RELEASE_BODY<<EOF"
              echo "Automated nightly build."
              echo ""
              echo "- Commit: ${GITHUB_SHA}"
              echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo "- Date (UTC): $(date -u +'%Y-%m-%d %H:%M:%S')"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ptoas-wheel-*
          path: release-artifacts
          merge-multiple: true

      - name: Download x86_64 binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ptoas-bin-x86_64
          path: release-artifacts/ptoas-bin-x86_64

      - name: Download aarch64 binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ptoas-bin-aarch64
          path: release-artifacts/ptoas-bin-aarch64

      - name: Collect packaged ptoas binaries
        run: |
          set -euo pipefail
          mv "release-artifacts/ptoas-bin-x86_64/ptoas-bin-x86_64.tar.gz" \
            "release-artifacts/ptoas-bin-x86_64.tar.gz"
          mv "release-artifacts/ptoas-bin-aarch64/ptoas-bin-aarch64.tar.gz" \
            "release-artifacts/ptoas-bin-aarch64.tar.gz"

      - name: Upload wheel assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          make_latest: ${{ env.RELEASE_MAKE_LATEST }}
          body: ${{ env.RELEASE_BODY }}
          overwrite_files: true
          files: release-artifacts/*.whl

      - name: Upload binary assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          make_latest: ${{ env.RELEASE_MAKE_LATEST }}
          body: ${{ env.RELEASE_BODY }}
          overwrite_files: true
          files: release-artifacts/*.tar.gz

  bump_base_version:
    name: Bump base version after release
    if: github.event_name == 'release' && github.event.action == 'released' && (startsWith(github.ref_name, 'ptoas-v') || (startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'vmi-v')))
    needs: upload_release_assets
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update CMake base version
        id: bump
        run: |
          next_base_version="$(python3 .github/scripts/update_ptoas_base_version.py \
            --version "${GITHUB_REF_NAME}" \
            --next)"
          echo "next_base_version=${next_base_version}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          if git diff --quiet -- CMakeLists.txt; then
            echo "CMakeLists.txt already matches the next base version."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt
          git commit -m "chore(release): bump base version to v${{ steps.bump.outputs.next_base_version }}"
          git push origin HEAD:${{ github.event.repository.default_branch }}
